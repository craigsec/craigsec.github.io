/* ============================================================
   LAYOUT CONCEPT: single-column terminal shell — a fixed CRT
   frame holds a scrollable command log; input docked at the
   bottom; a mobile command bar replaces typing on small screens.
   This design deliberately commits to one dark "CRT phosphor"
   world, so it is single-theme by design (no light mode).
   ============================================================ */
:root {
  /* Color — phosphor palette on deep CRT black */
  --bg: #080b11;            /* deep, slightly lifted slate-black */
  --bg-panel: #0a0f14;      /* raised panel */
  --bg-panel-2: #0d141b;    /* inset / card */
  --fg: #c8f7e0;            /* soft phosphor text, high contrast on --bg */
  --fg-dim: #6f8f87;        /* muted readout text */
  --green: #39ff93;         /* primary neon green */
  --cyan: #38e8ff;          /* secondary cyan */
  --magenta: #ff5cf0;       /* accent magenta */
  --amber: #ffd166;         /* warning amber */
  --red: #ff5c6c;           /* critical */
  --line: #15303088;        /* grid / border line */
  --glow-green: 0 0 6px #39ff9340;
  --glow-cyan: 0 0 6px #38e8ff3a;
  --glow-red: 0 0 8px #ff2a4650;

  /* Type */
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
  --font-disp: 'Orbitron', var(--font-mono);

  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1100px 520px at 12% -8%, rgba(56,232,255,0.055), transparent 60%),
    radial-gradient(900px 480px at 100% 112%, rgba(255,42,70,0.045), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 15px;
  line-height: 1.55;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- CRT frame + scanlines + vignette ---------- */
#crt {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#scanlines, #flicker, #vignette, #matrix {
  position: fixed; inset: 0; pointer-events: none; z-index: 5;
}
/* CRT grain (scanlines / vignette / flicker / glitch canvas) removed for a clean, modern surface */
#matrix, #scanlines, #flicker, #vignette { display: none; }
@keyframes flicker {
  0%,96%,100%{opacity:.4} 97%{opacity:.1} 98%{opacity:.7} 99%{opacity:.25}
}

/* ---------- Top status bar ---------- */
#bar {
  position: relative; z-index: 4;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px));

}
#bar .dot { width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;}
#bar .brand { color: var(--red); font-family: var(--font-disp); letter-spacing: 2px; text-shadow: var(--glow-red); font-weight:700; }
#bar .spacer { flex: 1; }
#bar .stat { white-space: nowrap; }
#bar .stat b { color: var(--cyan); font-weight: 400; }
#reboot {
  background: transparent; border: 1px solid var(--line); color: var(--fg-dim);
  font-family: var(--font-mono); font-size: 11px; padding: 3px 9px; cursor: pointer;
  border-radius: 3px; letter-spacing: 1px;
}
#reboot:hover, #reboot:focus-visible { color: var(--green); border-color: var(--green); box-shadow: var(--glow-green); outline: none; }

/* ---------- Terminal scroll region ---------- */
#screen {
  position: relative; z-index: 2;
  flex: 1 1 auto; overflow-y: auto; overflow-x: hidden;
  padding: 18px max(16px, env(safe-area-inset-left,0px)) 10px;
  padding-right: max(16px, env(safe-area-inset-right,0px));
  scroll-behavior: smooth;
}
#screen::-webkit-scrollbar { width: 10px; }
#screen::-webkit-scrollbar-thumb { background: #15303a; border-radius: 10px; }
#log { max-width: 900px; margin: 0 auto; }

/* generic output block */
.block { margin: 0 0 18px; animation: fadein .35s ease both; }
@keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

.prompt-line { color: var(--fg-dim); margin-bottom: 6px; word-break: break-word; }
.prompt-line .ps { color: var(--green); }
.prompt-line .ph { color: var(--cyan); }

h2.section { font-family: var(--font-disp); font-weight: 700; letter-spacing: 3px;
  color: var(--cyan); text-shadow: var(--glow-cyan); font-size: 15px; margin: 2px 0 12px;
  text-transform: uppercase; }
.muted { color: var(--fg-dim); }
.green { color: var(--green); } .cyan { color: var(--cyan); } .mag { color: var(--magenta); }
.amber { color: var(--amber); } .red { color: var(--red); }
a { color: var(--cyan); text-decoration: none; border-bottom: 1px dotted #38e8ff66; }
a:hover, a:focus-visible { color: var(--green); border-color: var(--green); outline: none; }

/* ---------- Login banner ---------- */
.banner { border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px;
  background: linear-gradient(135deg, #0a1014, #0a0f14); position: relative; overflow: hidden; }
.banner::before { content:""; position:absolute; inset:0;
  background: radial-gradient(600px 120px at 10% 0%, #ff2a4614, #0000 60%); pointer-events:none; }
.banner .big { font-family: var(--font-disp); font-weight: 800; font-size: clamp(24px, 6.4vw, 46px);
  letter-spacing: 3px; color: var(--red); text-shadow: var(--glow-red); margin: 0; line-height: 1.05; }
.banner .role { color: var(--cyan); letter-spacing: 3px; text-transform: uppercase; font-size: 13px; margin-top: 4px; }
.banner-top { display:flex; gap:18px; align-items:center; }
.banner-id { min-width:0; }
.avatar { width:120px; height:120px; border-radius:10px; object-fit:cover; flex:0 0 auto;

@media (max-width:520px){ .avatar{ width:96px; height:96px; } }
@media (max-width:420px){ .banner-top{ flex-direction:column; align-items:flex-start; gap:12px; } }
.banner .meta { margin-top: 12px; display:grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 6px 18px; font-size: 13px; }
.banner .meta span b { color: var(--fg); font-weight: 400; }

/* ---------- command shortcut chips ---------- */
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.chip { background: var(--bg-panel-2); border:1px solid var(--line); color: var(--cyan);

  letter-spacing:1px; transition: all .15s; }
.chip:hover, .chip:focus-visible { color: var(--bg); background: var(--cyan); box-shadow: var(--glow-cyan); outline:none; transform: translateY(-1px); }
.chip::before { content:"› "; opacity:.6; }

/* ---------- resume view/download buttons ---------- */
.resbtn { display:inline-block; font-family: var(--font-mono); font-size: 13px; letter-spacing:.5px;
  padding:7px 14px; border-radius:6px; margin:0 8px 8px 0; text-decoration:none; cursor:pointer;
  border:1px solid var(--cyan); color: var(--bg); background: var(--cyan); transition: all .15s; }
.resbtn:hover, .resbtn:focus-visible { box-shadow: var(--glow-cyan); transform: translateY(-1px); outline:none; }
.resbtn.alt { background: transparent; color: var(--cyan); }
.resbtn.alt:hover, .resbtn.alt:focus-visible { background: var(--cyan); color: var(--bg); }
.pdfwrap { margin-top:12px; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; }
.pdfframe { width:100%; height:72vh; min-height:460px; border:0; display:block; }
@media (max-width:680px){ .pdfframe { height:60vh; min-height:360px; } }

/* ---------- help grid ---------- */
.cmd-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 8px 20px; }
.cmd-grid .row { display:flex; gap:10px; }
.cmd-grid .k { color: var(--green); min-width: 92px; }

/* ---------- skill meters ---------- */
.skgroup { margin-bottom: 16px; }
.skgroup h3 { color: var(--magenta); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 8px; }
.sk-tags { display:flex; flex-wrap:wrap; gap:8px; margin: 0 0 14px; }
.sk-tag { border:1px solid var(--line); background: var(--bg-panel-2); color: var(--fg);

  letter-spacing: .2px; transition: border-color .15s, color .15s;
  animation: tagin .34s cubic-bezier(.2,.75,.3,1) both; animation-delay: var(--d, 0s); }
@keyframes tagin { from{ opacity:0; transform: translateY(7px) scale(.96); }
                   to{ opacity:1; transform: none; } }
.sk-tag:hover { border-color: var(--cyan); color: var(--cyan); }
.meter { display:grid; grid-template-columns: 170px 1fr 46px; align-items:center; gap: 10px; margin: 5px 0; }
.meter .lbl { color: var(--fg); font-size: 13px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.meter .track { height: 10px; background: #0e1a1a; border:1px solid var(--line); border-radius: 6px; overflow:hidden; }
.meter .fill { height:100%; width:0; border-radius:6px;
  background: linear-gradient(90deg, var(--green), var(--cyan));
  box-shadow: 0 0 8px #39ff9355; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
.meter .pct { color: var(--cyan); font-size: 12px; text-align:right; font-variant-numeric: tabular-nums; }
@media (max-width:520px){ .meter{grid-template-columns: 110px 1fr 40px;} }

/* ---------- sysadmin ops log ---------- */
.opslog { border:1px solid var(--line); border-radius:6px; background: var(--bg-panel-2); padding:12px 14px; }
.opslog .head { color: var(--fg-dim); font-size:12px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
.opslog .head .blink2 { color: var(--green); animation: blink 1.4s steps(1) infinite; }
.opsline { display:flex; gap:10px; align-items:baseline; margin:5px 0; font-size:13px;
  animation: opsin .32s cubic-bezier(.2,.75,.3,1) both; animation-delay: var(--d, 0s); }
@keyframes opsin { from{ opacity:0; transform: translateX(-8px); } to{ opacity:1; transform: none; } }
/* generic line-by-line "roll out" reveal (projects / timeline / creds) */
@keyframes rollin { from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform: none; } }
.rollin { animation: rollin .34s cubic-bezier(.2,.75,.3,1) both; animation-delay: var(--d, 0s); }
/* gentlest reveal: a slow, pure opacity fade, no movement */
@keyframes softfade { from{ opacity:0; } to{ opacity:1; } }
.softfade { animation: softfade .85s ease both; animation-delay: var(--d, 0s); }

/* vessel network topology */
.topo-wrap{ display:flex; gap:14px; flex-wrap:wrap; margin:6px 0; align-items:flex-start; }
.topo-stage{ flex:1 1 440px; min-width:280px; border:1px solid var(--line); border-radius:8px; padding:6px;

.topo-svg{ width:100%; height:auto; display:block; }

.td-tag{ display:inline-block; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; border:1px solid; border-radius:4px; padding:2px 7px; }
.td-empty{ color:var(--fg-dim); font-size:12.5px; }
.tnode{ cursor:pointer; outline:none; }
.tnode rect{ fill:#0e1a1acc; stroke:var(--tc); stroke-width:1.3; transition:fill .15s, filter .15s, stroke-width .15s; }
.tnode .tlabel{ fill:var(--tc); font-family:var(--font-mono); font-size:12.5px; font-weight:600; letter-spacing:.2px; }
.tnode .tdot{ fill:var(--tc); }
.tnode .tbadge{ fill:var(--fg-dim); font-family:var(--font-mono); font-size:9px; letter-spacing:1px; text-transform:uppercase; }
.tnode:hover rect, .tnode:focus rect, .tnode.sel rect{ fill:#14282899; filter:drop-shadow(0 0 6px var(--tc)); }
.tnode.sel rect{ stroke-width:2.2; }
.tedge{ fill:none; stroke:var(--fg-dim); stroke-width:1.3; opacity:.5; }
.tedge.active{ stroke:var(--green); opacity:.9; stroke-dasharray:6 6; animation:tflow 1s linear infinite; }
.tedge.standby{ stroke:var(--cyan); opacity:.35; stroke-dasharray:3 6; }
.tedge.power{ stroke:var(--amber); opacity:.55; stroke-dasharray:2 5; }
@keyframes tflow{ to{ stroke-dashoffset:-12; } }
@media(max-width:620px){ .topo-detail{ flex:1 1 100%; } }
.opsline .ts { color:#4a6a62; font-size:11px; min-width:62px; font-variant-numeric:tabular-nums; }
.opsline .tag2 { min-width:112px; letter-spacing:.3px; }
.opsline .msg { color: var(--fg); min-width:0; }
@media (max-width:520px){ .opsline .ts{display:none} .opsline .tag2{min-width:92px} }

/* ---------- project card ---------- */
.proj { border:1px solid var(--line); border-radius:6px; padding:16px 18px; background: var(--bg-panel-2);
  position:relative; overflow:hidden; transition: border-color .2s, box-shadow .2s; }
.proj:hover { border-color: var(--magenta); box-shadow: 0 0 14px #ff5cf033; }
.proj .ptitle { font-family: var(--font-disp); color: var(--magenta); letter-spacing:2px; font-size: 16px; margin:0 0 4px; }
.proj .tag { display:inline-block; font-size: 10px; letter-spacing:1px; color: var(--amber);
  border:1px solid #ffd16644; padding:2px 7px; border-radius: 10px; margin-bottom:10px; text-transform:uppercase; }
.proj .ethics { border-left: 2px solid var(--green); padding-left:10px; margin:12px 0; color:var(--fg-dim); font-size:12.5px; }
.proj ul { margin:8px 0; padding-left:18px; } .proj li { margin:3px 0; }
.ph { color: var(--amber); } /* placeholder marker */
code.inl { background:#0e1a1a; border:1px solid var(--line); padding:1px 5px; border-radius:3px; color:var(--cyan); font-size:.92em; }

/* ---------- timeline ---------- */
.tl { list-style:none; margin:4px 0 0; padding:0; position:relative; }
.tl::before { content:""; position:absolute; left:6px; top:6px; bottom:12px; width:2px;
  background: linear-gradient(180deg, var(--cyan), var(--green)); opacity:.4; }
.tl li { position:relative; padding:0 0 22px 30px; }
.tl li:last-child { padding-bottom:4px; }
.tl .node { position:absolute; left:0; top:3px; width:14px; height:14px; border-radius:50%;
  background: var(--bg-panel); border:2px solid var(--cyan); box-shadow:0 0 0 3px var(--bg); transition: border-color .2s; }
.tl li.current .node { border-color: var(--green); background: var(--green);
  box-shadow: 0 0 0 3px var(--bg), 0 0 8px #39ff9377; animation: pulse 2.2s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 3px var(--bg), 0 0 6px #39ff9355} 50%{box-shadow:0 0 0 3px var(--bg), 0 0 15px #39ff93bb} }
.tl .yr { display:inline-block; font-family: var(--font-mono); font-size:10.5px; letter-spacing:1.5px;
  color: var(--cyan); border:1px solid var(--line); border-radius:4px; padding:2px 8px; margin-bottom:7px;
  text-transform:uppercase; white-space:nowrap; }
.tl li.current .yr { color: var(--green); border-color:#39ff9355; background:#39ff930d; }
.tl .ev { color: var(--fg); font-size: 14.5px; margin-bottom:3px; transition: color .15s; }
.tl li:hover .ev { color: var(--cyan); }
.tl li.current:hover .ev { color: var(--green); }
.tl .de { color: var(--fg-dim); font-size:12.5px; line-height:1.55; max-width:62ch; }

/* ---------- contact ---------- */
.contact .ln { display:flex; gap:10px; align-items:center; margin:5px 0; }
.contact .ln .ic { color: var(--green); width: 92px; font-size:12px; letter-spacing:1px; }
.copybtn { background:transparent; border:1px solid var(--line); color:var(--fg-dim); font-family:var(--font-mono);
  font-size:10px; padding:1px 7px; border-radius:3px; cursor:pointer; margin-left:6px; }
.copybtn:hover { color:var(--green); border-color:var(--green); }

/* ---------- input dock ---------- */
#dock { position:relative; z-index:4; flex:0 0 auto; border-top:1px solid var(--line);
  background: linear-gradient(0deg,#0a0f14,#070b0f);
  padding: 10px max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px));

#inputline { max-width:900px; margin:0 auto; display:flex; align-items:center; gap:8px; }

#cmd { flex:1; min-width:0; background:transparent; border:none; outline:none; color:var(--fg);
  font-family:var(--font-mono); font-size:15px; caret-color: transparent; }
#cmd::placeholder { color:#3c5a52; }
/* EVO-style blinking block cursor: native caret is hidden, this box is drawn at the text position */
#mirror { position:absolute; left:0; top:0; visibility:hidden; white-space:pre; pointer-events:none;
  font-family:var(--font-mono); font-size:15px; }
#blockcur { position:absolute; left:0; top:50%; transform:translateY(-50%); width:9px; height:1.1em;

/* command bar — persistent shortcuts, pinned at the bottom on desktop and mobile */
#mobile-cmds { display:grid; grid-template-columns: repeat(6, minmax(0,1fr));
  gap:8px; max-width:900px; margin:10px auto 0; }
#mobile-cmds button { background:var(--bg-panel-2); border:1px solid var(--line); color:var(--cyan); text-align:center;
  font-family:var(--font-mono); font-size:12.5px; padding:9px 10px; border-radius:7px; cursor:pointer; letter-spacing:.5px;
  transition: background .14s ease, color .14s ease, border-color .14s ease, box-shadow .14s ease, transform .14s ease; }
#mobile-cmds button:hover,
#mobile-cmds button:focus-visible { background:var(--cyan); color:var(--bg); border-color:var(--cyan);
  box-shadow:var(--glow-cyan); transform:translateY(-1px); outline:none; }

@media (max-width: 680px){

}

/* boot sequence */
#boot { position:fixed; inset:0; z-index:50; background:var(--bg); color:var(--green);
  font-family:var(--font-mono); font-size:13.5px; padding: max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px));

/* keep the boot sequence scrollbar-free */
html, body, #boot, #boot *, #bootlog, #bootart { scrollbar-width: none; -ms-overflow-style: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar, #boot::-webkit-scrollbar, #boot *::-webkit-scrollbar, #bootlog::-webkit-scrollbar, #bootart::-webkit-scrollbar { width:0; height:0; display:none; }

/* phishing case-study — spot the phish */
.ph-mail{ border:1px solid var(--line); border-radius:6px; background:#0b1114; margin:10px 0; overflow:hidden; }

.flag.found{ background:#ff2a4633; color:var(--red); border-bottom:1px solid var(--red); cursor:default; }
.flag-link{ color:var(--cyan); text-decoration:underline; }
.ph-count{ color:var(--amber); font-size:12.5px; margin:8px 0 2px; }
.ph-find{ margin:3px 0; font-size:12.5px; }
.ph-btn{ background:transparent; border:1px solid var(--line); color:var(--fg-dim); font-family:var(--font-mono); font-size:12px; padding:6px 12px; border-radius:6px; cursor:pointer; margin:8px 0; }
.ph-btn:hover{ border-color:var(--green); color:var(--green); }

/* Konami-code glitch flash */
@keyframes konflash { 0%,100%{ filter:none } 50%{ filter: hue-rotate(150deg) saturate(1.7) } }
/* ---- sudo rm -rf easter-egg glitch ---- */
@keyframes rmShake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-3px,2px)} 40%{transform:translate(3px,-2px)} 60%{transform:translate(-2px,-1px)} 80%{transform:translate(2px,1px)} }
@keyframes rmFlick { 0%,100%{opacity:1} 50%{opacity:.78} 77%{opacity:.92} }
.rm-glitch{ position:fixed; inset:0; z-index:9999; background:#05070a; display:flex; align-items:center; justify-content:center;
  overflow:hidden; animation: rmFlick .16s steps(2,end) infinite; }
.rm-glitch::before{ content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 3px); }
.rm-glitch-txt{ font-family:var(--font-mono); font-weight:800; letter-spacing:4px; color:#ff2a46; text-align:center;
  font-size: clamp(24px, 9vw, 92px); line-height:1.2; text-shadow: 2px 0 #38e8ff, -2px 0 #39ff93; animation: rmShake .11s infinite; }
.rm-glitch-sub{ font-family:var(--font-mono); font-size: clamp(11px,2.4vw,15px); color:#39ff93; margin-top:14px; letter-spacing:1px; text-shadow:none; animation:none; }
@media (prefers-reduced-motion: reduce){ .rm-glitch, .rm-glitch-txt{ animation:none !important; } }
body.konami { animation: konflash .4s ease 2; }

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0;}
</style>

<canvas id="matrix" aria-hidden="true"></canvas>
<div id="scanlines" aria-hidden="true"></div>
<div id="flicker" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>

<!-- BOOT SEQUENCE -->
<div id="boot">
  <button class="skip" id="skipboot">SKIP ▸</button>
  <pre id="bootart" aria-hidden="true"></pre>
  <pre class="bootlog" id="bootlog" aria-hidden="true"></pre>
</div>

<!-- EASTER EGG -->
<div id="hire" role="dialog" aria-label="Hire Craig">
  <div class="card">
    <h1 class="glitch">ACCESS GRANTED</h1>
    <p id="hiremsg"></p>
    <button class="close" id="hireclose">[ press enter to close ]</button>
  </div>
</div>

<div id="crt">
  <div id="bar">
    <span class="brand">CRAIG::SH</span>
    <span class="stat hide-sm"><span class="dot" style="background:var(--green);box-shadow:var(--glow-green)"></span>secure shell</span>
    <span class="stat hide-sm">uptime <b id="uptime">00:00:00</b></span>
    <span class="stat hide-sm">load <b id="load">0.14</b></span>
    <span class="spacer"></span>
    <span class="stat muted" id="clock"></span>
    <button id="reboot" title="Replay boot sequence">⟲ reboot</button>
  </div>

  <div id="screen" tabindex="0" aria-label="Terminal output" aria-live="polite">
    <div id="log"></div>
  </div>

  <div id="dock">
    <div id="inputline">
      <span class="ps2">craig@portfolio:~$</span>
      <span id="inputwrap">
        <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false"
               aria-label="Type a command. Try help." placeholder="type 'help' and press enter…">
        <span id="mirror" aria-hidden="true"></span>
        <span id="blockcur" aria-hidden="true"></span>
      </span>
    </div>
    <div id="mobile-cmds" aria-label="Command shortcuts"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
